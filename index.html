<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de courses vegan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- STEP 1: Selection -->
    <div id="step-select" class="step active">
        <header>
            <div class="leaf-icon">🌿</div>
            <h1>Ma semaine vegan</h1>
            <p>Choisissez vos repas de la semaine et obtenez votre liste de courses automatiquement</p>
        </header>

        <div class="selectors">
            <div class="selector-card">
                <div class="selector-icon">🥗</div>
                <div class="selector-label">Entrées</div>
                <div class="counter">
                    <button class="counter-btn" onclick="adjust('starters', -1)">−</button>
                    <span class="counter-val" id="val-starters">2</span>
                    <button class="counter-btn" onclick="adjust('starters', +1)">+</button>
                </div>
            </div>

            <div class="selector-card">
                <div class="selector-icon">🍲</div>
                <div class="selector-label">Plats principaux</div>
                <div class="counter">
                    <button class="counter-btn" onclick="adjust('mains', -1)">−</button>
                    <span class="counter-val" id="val-mains">5</span>
                    <button class="counter-btn" onclick="adjust('mains', +1)">+</button>
                </div>
            </div>

            <div class="selector-card">
                <div class="selector-icon">🍰</div>
                <div class="selector-label">Desserts</div>
                <div class="counter">
                    <button class="counter-btn" onclick="adjust('desserts', -1)">−</button>
                    <span class="counter-val" id="val-desserts">2</span>
                    <button class="counter-btn" onclick="adjust('desserts', +1)">+</button>
                </div>
            </div>
        </div>

        <button class="cta-btn" onclick="generateMenu()">Générer mon menu 🛒</button>

        <p class="source-note">Recettes inspirées de <a href="https://menu-vegetarien.com/recettes-vegan/" target="_blank">menu-vegetarien.com</a></p>
    </div>

    <!-- STEP 2: Menu + Shopping list -->
    <div id="step-result" class="step">

        <div class="result-header">
            <button class="back-btn" onclick="goBack()">← Modifier</button>
            <h2>Mon menu de la semaine</h2>
        </div>

        <div id="menu-cards"></div>

        <div class="shopping-section">
            <h2>🛒 Liste de courses</h2>
            <div class="shopping-actions">
                <button class="action-btn" onclick="copyList()">📋 Copier</button>
                <button class="action-btn" onclick="regenerate()">🔄 Nouveau menu</button>
            </div>
            <ul id="shopping-list"></ul>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
